<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel with Janvi | Explore Chhattisgarh</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
        }

        header {
            background: #1a1a1a;
            color: #ffffff;
            padding: 0.5rem 0;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0.5rem 0;
        }

        .logo h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0 1rem;
            position: relative;
            z-index: 2;
        }

        .chhattisgarh-elements {
            display: flex;
            align-items: center;
        }

        .bastar-art {
            font-size: 36px;
            opacity: 0.8;
            margin: 0 0.5rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .nav-links {
            list-style: none;
            display: flex;
            justify-content: center;
            background-color: #ffffff;
            padding: 0.2rem 0;
        }

        .nav-links li {
            margin: 0 8px;
        }

        .nav-links a {
            text-decoration: none;
            color: #1a1a1a;
            font-size: 0.9rem;
            padding: 4px 12px;
            border-radius: 15px;
            transition: all 0.3s ease;
            background-color: #f0f0f0;
        }

        .nav-links a:hover {
            background-color: #e74c3c;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .info-box {
            background-color: #ffffff;
            color: #1a1a1a;
            padding: 10px;
            font-size: 0.9rem;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .info-item {
            display: flex;
            align-items: center;
            margin: 5px 10px;
        }

        .info-item span {
            margin-right: 5px;
        }

        .hero {
            height: calc(100vh - 120px); /* Adjust based on your header height */
            background-image: url('https://images.pexels.com/photos/2014806/pexels-photo-2014806.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1');
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            position: relative;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
        }

        .hero-text {
            text-align: center;
            z-index: 1;
            animation: fadeInUp 1.5s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero h2 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
        }

        .hero p {
            font-size: 1.8rem;
            margin-bottom: 2rem;
        }

        .hero .btn {
            padding: 15px 40px;
            background: #ff6b6b;
            color: #fff;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
            font-weight: bold;
            border-radius: 50px;
            font-size: 1.2rem;
        }

        .hero .btn:hover {
            background: #ff8787;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>

                <span class="bastar-art" style="animation-delay: 1s;">🏞️</span>
            </div>
            <div class="logo">
                <h1>TRAVEL WITH JANVI</h1>
            </div>
            <div class="chhattisgarh-elements">
                <span class="bastar-art" style="animation-delay: 1.5s;">🦚</span>
                <span class="bastar-art" style="animation-delay: 2s;">🍃</span>
                <span class="bastar-art" style="animation-delay: 2.5s;">🏺</span>
            </div>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>

            </ul>
        </nav>
    </header>
    <div class="info-box">

        <div class="info-item"><span>🍃</span> Lush greenery</div>
        <div class="info-item"><span>🏺</span> Traditional pottery</div>
    </div>

    <section id="home" class="hero">
        <div class="hero-text">
            <h2>Discover Chhattisgarh</h2>
            <p>Embark on an unforgettable journey</p>
            <a href="cities.html" class="btn">Start Exploring</a>
        </div>
    </section>

    <!-- ... rest of the body content ... -->
</body>
</html>
