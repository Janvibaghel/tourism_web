<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEMPLE</title>
    <style>
        body {
            font-family: 'Times New Roman',serif;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #f2f2f2;
            padding: 10px 0;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        nav a {
            color: #333;
            text-decoration: none;
        }

        .container {
            max-width: 960px;
            margin: 20px auto;
            padding: 0 20px;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .search-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        input[type="text"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            background-color: #ff5733;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .destination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 5px;
        }

        .destination img {
            width: 200px;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
        }

        .destination .info {
            flex: 1;
            padding-left: 20px;
        }

        .destination .info h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .destination .info p {
            line-height: 1.5;
        }

        .destination .info .location {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="home.html">Home</a>
        </nav>
    </header>

    <div class="container">
        <h1>TEMPLE</h1>

        <div class="search-bar">
            <input type="text" placeholder="Where are you going?">
            <button>SEARCH</button>
        </div>

        <div class="destination">
            <img src="Images/TATAPANI.jpg" alt="Tatapani">
            <div class="info">
                <a href="your-link-here" style="text-decoration: none;">
                    <h2>Tatapani</h2>
                </a>
                <p class="location">Balrampur</p>
                
            </div>
            <i class="fas fa-heart"></i>
        </div>

        <div class="destination">
            <img src="https://images.unsplash.com/photo-1537007739001-0169a5072c51?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1287&q=80" alt="Pahadi mandir">
            <div class="info">
                <a href="your-link-here" style="text-decoration: none;">
                    <h2>Pahadi mandir</h2>
                </a>
                <p class="location">Balrampur</p>
                
            </div>
            <i class="fas fa-heart"></i>
        </div>

        <div class="destination">
            <img src="Images/DEVIPATAN.jpg" alt="Devi patan mandir">
            <div class="info">
                <a href="your-link-here" style="text-decoration: none;">
                    <h2>Devi patan mandir</h2>
                </a>
                <p class="location">Balrampur</p>
                
            </div>
            <i class="fas fa-heart"></i>
        </div>

        <div class="destination">
            <img src="https://images.unsplash.com/photo-1479588238355-2cb2424c1d43?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1287&q=80" alt="Bijlipur mandir">
            <div class="info">
                <a href="your-link-here"style="text-decoration: none;">
                    <h2>Bijlipur mandir</h2>
                </a>
                <p class="location">Balrampur</p>
                
            </div>
            <i class="fas fa-heart"></i>
        </div>
    </div>
</body>
</html>
