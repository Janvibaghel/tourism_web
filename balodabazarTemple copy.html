<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple</title>
    <style>
        body {
            font-family: 'Times New Roman',serif;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #f2f2f2;
            padding: 10px 0;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        nav a {
            color: #333;
            text-decoration: none;
        }

        .container {
            max-width: 960px;
            margin: 20px auto;
            padding: 0 20px;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .search-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        input[type="text"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            background-color: #ff5733;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .destination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 5px;
        }

        .destination img {
            width: 200px;
            height: 150px;
            object-fit: cover;
            border-radius: 5px;
        }

        .destination .info {
            flex: 1;
            padding-left: 20px;
        }

        .destination .info h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .destination .info p {
            line-height: 1.5;
        }

        .destination .info .location {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="home.html">Home</a>
        </nav>
    </header>

    <div class="container">
        <h1>TEMPLE</h1>

        <div class="search-bar">
            <input type="text" placeholder="Where are you going?">
            <button>SEARCH</button>
        </div>

        <div class="destination">
            <img src="Images/Turturiya.jpg" alt="..">
            <div class="info">
                <a href="your-link-here" style="text-decoration: none;">
                    <h2>Turturiya Dham</h2>
                </a>
                
                <p class="location">Turturiya</p>
                <!--<p>Home to the state animal of Maharashtra, Indian Giant Squirrel, the Bhimashankar Wildlife Sanctuary is a vast, bio-diverse wonder located 138 kilometres from the city of Pune.</p>-->
            </div>
            <i class="fas fa-heart"></i>
        </div>

        <div class="destination">
            <img src="Images/damakhedha.jpg" alt="Mahamaya Temple">
            <div class="info">
                <a href="your-link-here" style="text-decoration: none;">
                    <h2>Kabir Aashram</h2>
                </a>
                
                <p class="location">Damakhedha</p>
                <!--<p>With its dense forests and beautiful vegetation, the Kaas Plateau Reserved Forest is a gem waiting to be explored.</p>-->
            </div>
            <i class="fas fa-heart"></i>
        </div>

        
    </div>
</body>
</html>
